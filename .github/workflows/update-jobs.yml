name: Auto-update jobs data (cloud)

# GitHub's servers scrape + publish fresh data twice daily (06:00 & 18:00 Casablanca).
# The phone APK pulls it on every refresh — no PC needed.
on:
  schedule:
    - cron: '0 5,17 * * *'
  workflow_dispatch:

# NEW repos default to a READ-ONLY token — without this the push silently fails.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper deps
        working-directory: scraper
        run: npm install --no-audit --no-fund

      - name: Scrape latest offers
        working-directory: scraper
        run: npm run scrape

      - name: Export APK snapshots
        working-directory: scraper
        run: npm run export:apk
        env:
          APK_PUBLIC_DIR: ../app/public

      - name: Export Marchés Publics snapshot
        working-directory: scraper
        run: npm run export:marches
        env:
          APK_PUBLIC_DIR: ../app/public

      - name: Commit + push fresh data
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add app/public/jobs.json app/public/alerts.json app/public/exams-index.json app/public/exams app/public/marches.json scraper/data/jobs.json scraper/data/runs.json scraper/data/notifications.json
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "jobs: auto refresh $(date -u +%F_%H%M)"
          git push
          echo "PUSHED: fresh data is live"
