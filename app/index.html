<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B2B4B" />
<script>
  // Applique le thème avant le premier rendu pour éviter tout flash clair/sombre.
  (function () {
    try {
      var pref = localStorage.getItem('mjh_theme_v1') || 'auto';
      if (pref !== 'dark' && pref !== 'light') pref = 'auto';
      var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.dataset.theme = dark ? 'dark' : 'light';
      root.dataset.themePref = pref;
      root.style.colorScheme = dark ? 'dark' : 'light';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#070C16' : '#0B2B4B');
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>
<title>ASSOULI AUTOX</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
