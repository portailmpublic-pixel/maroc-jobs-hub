apply plugin: 'com.android.application'

// Jeton GitHub local (jamais publie) : app/android/adminapp/admin-token.txt
def adminToken = ""
def tokenFile = file("admin-token.txt")
if (tokenFile.exists()) {
    adminToken = tokenFile.text.trim()
}

android {
    namespace "ma.marocjobs.admin"
    compileSdk 34

    defaultConfig {
        applicationId "ma.marocjobs.hub.admin"
        minSdk 22
        targetSdk 34
        versionCode 7
        versionName "1.5.1"
        buildConfigField "String", "GITHUB_TOKEN", "\"${adminToken}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md', 'META-INF/NOTICE', 'META-INF/LICENSE']
        }
    }
}

dependencies {
    // Registre central : lecture IMAP de la boîte Gmail (comptes de tous les appareils).
    implementation "com.sun.mail:android-mail:1.6.7"
    implementation "com.sun.mail:android-activation:1.6.7"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
