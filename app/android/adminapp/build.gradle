apply plugin: 'com.android.application'

// Jeton GitHub local (jamais publie) : app/android/adminapp/admin-token.txt
def adminToken = ""
def tokenFile = file("admin-token.txt")
if (tokenFile.exists()) {
    adminToken = tokenFile.text.trim()
}

// Secrets locaux (jamais publies) : app/android/secrets.properties
def secrets = new Properties()
def secretsFile = rootProject.file("secrets.properties")
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
}
def imapPassword = secrets.getProperty("IMAP_PASSWORD", "")

// Version de l'APK principal, lue automatiquement dans app/build.gradle a la
// compilation : la console admin n'a plus rien a saisir pour forcer la MAJ.
def mainVersionCode = 20
def mainVersionName = "1.7.1"
def mainGradle = rootProject.file("app/build.gradle")
if (mainGradle.exists()) {
    def text = mainGradle.text
    def mc = (text =~ /versionCode\s+(\d+)/)
    if (mc.find()) mainVersionCode = mc.group(1) as int
    def mn = (text =~ /versionName\s+"([^"]+)"/)
    if (mn.find()) mainVersionName = mn.group(1)
}
def mainApkUrl = "https://portailmpublic-pixel.github.io/maroc-jobs-hub/ASSOULI-AUTOX.apk"
def mainApkMirror = "https://github.com/portailmpublic-pixel/maroc-jobs-hub/releases/download/v${mainVersionName}/ASSOULI-AUTOX.apk"

android {
    namespace "ma.marocjobs.admin"
    compileSdk 34

    defaultConfig {
        applicationId "ma.marocjobs.hub.admin"
        minSdk 22
        targetSdk 34
        versionCode 30
        versionName "1.6.14"
        buildConfigField "String", "GITHUB_TOKEN", "\"${adminToken}\""
        buildConfigField "String", "IMAP_PASSWORD", "\"${imapPassword}\""
        buildConfigField "int", "MAIN_VERSION_CODE", "${mainVersionCode}"
        buildConfigField "String", "MAIN_VERSION_NAME", "\"${mainVersionName}\""
        buildConfigField "String", "MAIN_APK_URL", "\"${mainApkUrl}\""
        buildConfigField "String", "MAIN_APK_MIRROR", "\"${mainApkMirror}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md', 'META-INF/NOTICE', 'META-INF/LICENSE']
        }
    }
}

dependencies {
    // Registre central : lecture IMAP de la boîte Gmail (comptes de tous les appareils).
    implementation "com.sun.mail:android-mail:1.6.7"
    implementation "com.sun.mail:android-activation:1.6.7"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
